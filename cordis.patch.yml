# dsh-memory bundle
#
# One row: the archive plugin. Its configuration is optional; the defaults pack
# every 15 exchanges into a new folder under <workspace>/.dsh-memory/packs/.
#
# To change the packing rhythm:
#
#   - id: memory-archive
#     name: '@local/dsh-memory'
#     config:
#       windowRounds: 20
#
# To follow DSH's own compaction instead of a fixed window:
#
#     config:
#       mode: sync
#
- insert:
    - id: memory-archive
      name: '@local/dsh-memory'
